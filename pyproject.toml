[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-multi-session-coordinator"
version = "0.1.0"
description = "DynamoDB-backed coordination leases for parallel Codex sessions and shared environments."
requires-python = ">=3.13,<3.14"
dependencies = ["boto3>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
codex-coordinator = "codex_multi_session_coordinator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
